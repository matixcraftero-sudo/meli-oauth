<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Volver a Margen</title><style>body{font:18px system-ui;max-width:600px;padding:32px;margin:10vh auto;color:#213247}a{display:inline-block;background:#f5d649;padding:14px 20px;border-radius:8px;color:#213247;text-decoration:none}p{line-height:1.6}</style></head><body><h1>Volvé a tu calculadora local</h1><p id="message">Comprobando el retorno de Mercado Libre…</p><a id="back" hidden rel="noreferrer">Continuar en Margen</a><script>
const p=new URLSearchParams(location.search),code=p.get('code'),state=p.get('state');history.replaceState(null,'',location.pathname);
if(code&&state&&/^[A-Za-z0-9_-]{40,100}$/.test(state)){const u=new URL('http://127.0.0.1:8765/oauth/callback');u.searchParams.set('code',code);u.searchParams.set('state',state);document.getElementById('back').href=u.href;document.getElementById('back').hidden=false;document.getElementById('message').textContent='El siguiente paso entrega la autorización a la aplicación que está abierta en esta computadora. No cierres la aplicación local.';}else document.getElementById('message').textContent='No se recibió una autorización válida. Volvé a Margen y elegí Conectar Mercado Libre.';
</script></body></html>
